name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAMTRA_DATADIR: ""

jobs:
  pip-build:
    name: pip install (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev libfftw3-dev libnetcdff-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openblas pkgconf netcdf fftw

      - name: Install Python build/runtime/test dependencies
        run: pip install meson-python meson ninja Cython numpy netCDF4 scipy pytest

      - name: Install pyPamtra (editable, keeps build/ around for meson test)
        run: pip install --no-build-isolation -e . -Cbuild-dir=build

      - name: Smoke test import
        run: python -c "import pyPamtra; print(pyPamtra.__file__)"

      - name: Run pytest
        run: pytest tests/ -v

      - name: Run Fortran unit tests
        run: meson test -C build --print-errorlogs

  make-build:
    name: make pamtra (legacy CLI build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libfftw3-dev libnetcdf-dev libnetcdff-dev

      - name: make pamtra
        run: make pamtra

      - name: Check binary exists
        run: test -x bin/pamtra

  docs:
    name: Build Sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev libfftw3-dev libnetcdff-dev

      - name: Install pyPamtra and Sphinx
        run: |
          pip install .
          pip install sphinx

      - name: Build docs
        run: |
          cd doc
          make html
