{% set name = "pyPamtra" %}
{% set version = "1.0.3" %}

# Draft conda-forge-style recipe. Usable today for local testing with
# conda-build/rattler-build (see conda-recipe/README.md); intended as the
# direct basis for a future conda-forge/staged-recipes submission, which
# is a separate, manual maintainer step (needs its own PR review process
# there) and not something this recipe does on its own.

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # meson.build's openblas fallback logic prefers an env-local libopenblas
  # (this recipe's own host dependency) over pkg-config or Homebrew, so no
  # extra environment wiring is needed here for that.

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('fortran') }}
    - pkg-config
    - ninja
  host:
    - python
    - pip
    - meson-python
    - cython
    - numpy
    - netcdf4
    - libopenblas
    - fftw
    - libnetcdf
  run:
    - python
    - {{ pin_compatible('numpy') }}
    - scipy
    - netcdf4
    - matplotlib
    - libopenblas

test:
  imports:
    - pyPamtra
  requires:
    - pytest
  source_files:
    - tests
  commands:
    - PAMTRA_DATADIR="" pytest tests -v

about:
  home: https://github.com/igmk/pamtra
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Passive and Active Microwave TRAnsfer radiative transfer model
  description: |
    Python/Fortran 90 package to solve the passive and active microwave
    radiative transfer in a plane-parallel horizontally homogeneous
    atmosphere with hydrometeors.
  doc_url: https://pamtra.readthedocs.io/
  dev_url: https://github.com/igmk/pamtra

extra:
  recipe-maintainers:
    - mmaahn
