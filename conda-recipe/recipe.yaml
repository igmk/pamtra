context:
  name: pamtra
  version: "1.0.3"

# v1 (rattler-build) recipe. conda-forge/staged-recipes requires this format for
# new submissions -- the old conda-build v0 meta.yaml format is deprecated for
# new recipes. Usable today for local testing with rattler-build
# (`pixi global install rattler-build && rattler-build build --recipe
# conda-recipe/recipe.yaml -c conda-forge`); intended as the direct basis for
# a future conda-forge/staged-recipes submission, which is a separate,
# manual maintainer step (needs its own PR review process there) and not
# something this recipe does on its own. See RELEASING.md for the full
# release process.
#
# `source.path` below points at the repo checkout for local testing. A real
# submission needs a fetchable release instead -- swap this for:
#   source:
#     url: https://github.com/igmk/pamtra/archive/refs/tags/v${{ version }}.tar.gz
#     sha256: <sha256 of that tarball>

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ..
  # rattler-build ignores gitignored paths by default for local `path:`
  # sources -- descriptorfiles/* is gitignored (its individual files are
  # tracked as pre-existing exceptions, but the blanket pattern still
  # applies here) and would otherwise silently go missing from the build.
  # Irrelevant once this becomes a url+sha256 source: an extracted release
  # tarball has no such filtering.
  use_gitignore: false

build:
  number: 0
  script:
    - $PYTHON -m pip install . -vv --no-deps --no-build-isolation
  # meson.build's openblas fallback logic prefers an env-local libopenblas
  # (this recipe's own host dependency) over pkg-config or Homebrew, so no
  # extra environment wiring is needed here for that.

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - pkg-config
    - ninja
  host:
    - python
    - pip
    - meson-python
    - cython
    - numpy
    - netcdf4
    - libopenblas
    - fftw
    - libnetcdf
    - netcdf-fortran
  run:
    - python
    - ${{ pin_compatible('numpy') }}
    - scipy
    - netcdf4
    - matplotlib
    - libopenblas
    - netcdf-fortran
    - pooch

tests:
  # PAMTRA_DATADIR must be set (even to "") before `import pyPamtra` --
  # otherwise it tries to auto-fetch external data over the network, which
  # both isn't appropriate for a package test and currently fails outright
  # here (pooch's progress bar needs `tqdm`, which isn't a declared
  # dependency -- see conftest.py's PAMTRA_DATADIR handling for why the
  # test suite always sets this first).
  - script:
      - PAMTRA_DATADIR="" python -c "import pyPamtra"
      # test_unset_datadir_autofetches_and_imports is deselected: it
      # exercises the PAMTRA_DATADIR-unset auto-fetch path, which currently
      # fails on a missing `tqdm` dependency (pooch's progress bar) -- a
      # real, separately tracked bug, not a recipe issue. Re-enable once
      # that's fixed upstream. --rootdir=. pins pytest's config discovery to
      # the test working directory -- without it, pytest walks upward past
      # a local `path: ..` build dir (nested inside this checkout) and
      # picks up this repo's own pyproject.toml as rootdir instead,
      # silently breaking --deselect/-k matching.
      - PAMTRA_DATADIR="" pytest tests -v --rootdir=. --deselect tests/test_data_autofetch.py::test_unset_datadir_autofetches_and_imports
    requirements:
      run:
        - pytest
    files:
      source:
        - tests
        - descriptorfiles

about:
  homepage: https://github.com/igmk/pamtra
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Passive and Active Microwave TRAnsfer radiative transfer model
  description: |
    Python/Fortran 90 package to solve the passive and active microwave
    radiative transfer in a plane-parallel horizontally homogeneous
    atmosphere with hydrometeors.
  documentation: https://pamtra.readthedocs.io/
  repository: https://github.com/igmk/pamtra

extra:
  recipe-maintainers:
    - mmaahn
