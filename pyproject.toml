[build-system]
build-backend = 'mesonpy'
requires = [
         "wheel", # TODO check if required
         "meson-python",#>=0.8.0", 
#         "setuptools<60.0",  # Do not increase, 60.0 enables vendored distutils # useless in this project
         "Cython",#>=0.29.21", # TODO check if required
#         "python-dev-tools",  # apparently not required by this project and also causing spurius errors
#         "oldest-supported-numpy; python_version>'3.9'",
         "numpy",
         "netCDF4",
]

[project]
name = "pamtra"
license = {file = "LICENSE"}
version = "1.0.3"
description = "Python module pyPamtra"
long_description = "Python code that wraps the fantastic pamtra microwave radiative transfer model"
authors = [{name = "Pamtra team", email = "meteo-pamtra@uni-koeln.de"}]
maintainers = [
    {name = "Mario Mech"},
    {name = "Max Maahn"},
    {name = "Davide Ori"},
]
requires-python = ">=3.10" # matches versions tested in CI (meson-python / current numpy+netCDF4)
dependencies = [
    # TODO: update to "pin-compatible" once possible, see
    # https://github.com/FFY00/meson-python/issues/29
    "numpy>=1.19.5", ## TODO: copied from apexpy, not sure if it is relevant here
    "scipy", # TODO souds like this can also be dropped
    "netCDF4",
    "meteo_si>=0.2", # pyPamtra/meteoSI.py delegates most of its formulas here
    "matplotlib", # pyPamtra/__init__.py unconditionally imports pyPamtra.plot
    "pooch", # used by pamtra_data.py to fetch/cache PAMTRA_DATADIR contents
    "tqdm", # pooch's fetch() progress bar (default progressbar=True) needs this
]
readme = "readme.md"
keywords = ["microwave",
            "radiative transfer",
	    "atmosphere",
            "clouds",
            "radiometer",
            "radar"
	    ]
classifiers = [
    "Development Status :: 4 - Beta", # TODO maybe switch to 5 Production/Stable
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Fortran",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Utilities",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
# dynamic = ['version']

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
#doc = ["sphinx>=1.3", "sphinx-rtd-theme"]

[tool.cibuildwheel]
# Matches the pip-build matrix in .github/workflows/ci.yml.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = ["*-musllinux*", "*-win*", "pp*"]
build-verbosity = 1
before-all = "bash {project}/tools/cibw_before_all.sh"
environment = { PAMTRA_DEPS_PREFIX = "/tmp/pamtra-deps", PKG_CONFIG_PATH = "/tmp/pamtra-deps/openblas/lib/pkgconfig:/tmp/pamtra-deps/fftw/lib/pkgconfig" }
# -Dbuild_cli=false: the standalone pamtra CLI executable (needs netCDF-C/
# -Fortran/HDF5, unlike pyPamtraLib itself -- see meson.build/meson_options.txt)
# is dropped from wheel builds specifically. It kept segfaulting inside
# cibuildwheel's manylinux container in ways that didn't reproduce in any
# manually-built-and-repaired wheel tested outside that container, and the
# CLI isn't the point of a PyPI wheel -- `pip install .`/conda still build
# it by default (build_cli defaults to true there). Worth revisiting if the
# segfault's cause is ever pinned down, but not worth blocking on.
config-settings = { setup-args = "-Dbuild_cli=false" }
test-extras = ["test"]
# {project}/tests isn't part of the installed wheel (meson.build only
# installs python/pyPamtra and pamtra_data.py) -- {project} points back at
# the source checkout specifically so the test suite is still reachable.
# PAMTRA_DATADIR="" opts out of the data auto-fetch (see AI.md), same as
# ci.yml. test_cli_binary.py skips itself cleanly when no pamtra binary is
# on PATH (see its pamtra_binary fixture), so no separate exclusion is
# needed for build_cli=false here.
test-command = "PAMTRA_DATADIR=\"\" pytest {project}/tests -v"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# GitHub-hosted macOS runners' Homebrew gcc (needed for gfortran) requires
# macOS 14.0 as its own minimum target -- delocate refuses to repair a
# wheel tagged for an OLDER macOS (11.0, cibuildwheel's arm64 default)
# than the libraries it actually bundles (libgfortran/libquadmath), with
# "Library dependencies do not satisfy target MacOS version 11.0". Fully
# redeclaring `environment` here rather than just adding this one key: it
# was simpler to verify than relying on cibuildwheel's inheritance rules
# for how per-platform tables merge with the top-level one.
environment = { PAMTRA_DEPS_PREFIX = "/tmp/pamtra-deps", PKG_CONFIG_PATH = "/tmp/pamtra-deps/openblas/lib/pkgconfig:/tmp/pamtra-deps/fftw/lib/pkgconfig", MACOSX_DEPLOYMENT_TARGET = "14.0" }

[tool.coverage.run]
source = ["pyPamtra", "pamtra_data"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[project.scripts]
pamtra-fetch-data = "pamtra_data:_cli"

[project.urls]
source = 'https://github.com/igmk/pamtra.git'
documentation = "https://pamtra.readthedocs.io/"
tracker = "https://github.com/igmk/pamtra/issues"
download = "https://github.com/igmk/pamtra/releases"

