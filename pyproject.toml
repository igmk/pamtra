[build-system]
build-backend = 'mesonpy'
requires = [
         "wheel", # TODO check if required
         "meson-python",#>=0.8.0", 
#         "setuptools<60.0",  # Do not increase, 60.0 enables vendored distutils # useless in this project
         "Cython",#>=0.29.21", # TODO check if required
#         "python-dev-tools",  # apparently not required by this project and also causing spurius errors
#         "oldest-supported-numpy; python_version>'3.9'",
         "numpy",
         "netCDF4",
]

[project]
name = "pamtra"
license = {file = "LICENSE"}
version = "1.0.3"
description = "Python module pyPamtra"
long_description = "Python code that wraps the fantastic pamtra microwave radiative transfer model"
authors = [{name = "Pamtra team", email = "meteo-pamtra@uni-koeln.de"}]
maintainers = [
    {name = "Mario Mech"},
    {name = "Max Maahn"},
    {name = "Davide Ori"},
]
requires-python = ">=3.10" # matches versions tested in CI (meson-python / current numpy+netCDF4)
dependencies = [
    # TODO: update to "pin-compatible" once possible, see
    # https://github.com/FFY00/meson-python/issues/29
    "numpy>=1.19.5", ## TODO: copied from apexpy, not sure if it is relevant here
    "scipy", # TODO souds like this can also be dropped
    "netCDF4",
    "matplotlib", # pyPamtra/__init__.py unconditionally imports pyPamtra.plot
    "pooch", # used by pamtra_data.py to fetch/cache PAMTRA_DATADIR contents
    "tqdm", # pooch's fetch() progress bar (default progressbar=True) needs this
]
readme = "readme.md"
keywords = ["microwave",
            "radiative transfer",
	    "atmosphere",
            "clouds",
            "radiometer",
            "radar"
	    ]
classifiers = [
    "Development Status :: 4 - Beta", # TODO maybe switch to 5 Production/Stable
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Fortran",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Utilities",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
# dynamic = ['version']

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
#doc = ["sphinx>=1.3", "sphinx-rtd-theme"]

[tool.cibuildwheel]
# Matches the pip-build matrix in .github/workflows/ci.yml.
build = "cp311-* cp312-* cp313-* cp314-*"
skip = ["*-musllinux*", "*-win*", "pp*"]
build-verbosity = 1
before-all = "bash {project}/tools/cibw_before_all.sh"
environment = { PAMTRA_DEPS_PREFIX = "/tmp/pamtra-deps", PKG_CONFIG_PATH = "/tmp/pamtra-deps/openblas/lib/pkgconfig:/tmp/pamtra-deps/fftw/lib/pkgconfig:/tmp/pamtra-deps/netcdf/lib/pkgconfig" }
test-extras = ["test"]
# {project}/tests isn't part of the installed wheel (meson.build only
# installs python/pyPamtra and pamtra_data.py) -- {project} points back at
# the source checkout specifically so the test suite is still reachable.
# PAMTRA_DATADIR="" opts out of the data auto-fetch (see AI.md), same as
# ci.yml. No LD_LIBRARY_PATH/DYLD_LIBRARY_PATH needed here unlike the local
# testing done during development: by this point auditwheel/delocate have
# already repaired the wheel to load its own bundled copies via a relative
# rpath, so this doubles as a check that the repair actually worked.
test-command = "PAMTRA_DATADIR=\"\" pytest {project}/tests -v && pamtra -h"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"

[tool.coverage.run]
source = ["pyPamtra", "pamtra_data"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[project.scripts]
pamtra-fetch-data = "pamtra_data:_cli"

[project.urls]
source = 'https://github.com/igmk/pamtra.git'
documentation = "https://pamtra.readthedocs.io/"
tracker = "https://github.com/igmk/pamtra/issues"
download = "https://github.com/igmk/pamtra/releases"

